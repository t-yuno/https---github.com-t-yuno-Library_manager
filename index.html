<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵書貸出管理アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 8px; }
        button { padding: 8px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .available { background-color: #d4edda; color: #155724; }
        .borrowed { background-color: #f8d7da; color: #721c24; }
        .not-for-loan { background-color: #ffef6c; color: #262626; }
    </style>
</head>
<body>

    <h1>📚 蔵書貸出管理システム 📚</h1>

    <h2>検索条件</h2>
    <div class="form-group">
        <label for="book-title">タイトル（部分一致）</label>
        <input type="text" id="book-title" placeholder="例：リーダブルコード">
    </div>
    <div class="form-group">
        <label for="book-author">カテゴリ名</label>
        <input type="text" id="book-author" placeholder="例：資格">
    </div>
    <button onclick="alert('条件に応じてDBを検索し、下記の一覧を絞り込みます')">検索</button>

    <h2>図書一覧</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>蔵書番号</th>
                <th>タイトル</th>
                <th>著者名</th>
                <th>カテゴリ</th>
                <th>ステータス</th>
                <th>貸出日</th>
                <th>貸出</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>0000001</td>
                <td>基本情報技術者試験対策</td>
                <td>田中 太郎</td>
                <td>資格</td>
                <td><span class="status-badge available">貸出可能</span></td>
                <td>-</td>
                <td><button style="background-color: #007bff;">借りる</button></td>
            </tr>
            <tr>
                <td>2</td>
                <td>0000002</td>
                <td>モダンWeb開発入門</td>
                <td>山田 一郎</td>
                <td>フロントエンド</td>
                <td><span class="status-badge borrowed">貸出中</span></td>
                <td>2026/06/04</td>
                <td><button style="background-color: #8a8c8e;">借りる</button></td>
            </tr>
                        <tr>
                <td>3</td>
                <td>0000003</td>
                <td>AWS認定資格試験テキスト</td>
                <td>佐藤 二郎</td>
                <td>資格</td>
                <td><span class="status-badge not-for-loan">社内閲覧</span></td>
                <td>-</td>
                <td><button style="background-color: #8a8c8e;">借りる</button></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
