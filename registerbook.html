<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵書貸出管理アプリ</title>
    <style>
        /* 全体の基本スタイル */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #3da8e3;
        }

        /* ヘッダーのレイアウト */
        .header-container {
            display: flex;
            justify-content: space-between; 
            align-items: center;            
            /* 背景色に合わせて白線の境界線にする */
            border-bottom: 3px solid #ffffff;   
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        h1 { 
            /* 背景が青なので、ヘッダーの文字色は白にする */
            color: #ffffff; 
            margin: 0; 
            font-size: 32px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2); /* 視認性を上げるため薄い影をつける */
        }

        /* 入力用コンテナのスタイル */
        .confirm-container {
            max-width: 600px;
            margin: 40px auto;
            /* ボックスの背景色は白を指定する */
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            /* 背景が青なので影を少し強めにする */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #333333;
            /* 見出しの下線に全体のテーマカラーの青を使用する */
            border-bottom: 2px solid #3da8e3;
            padding-bottom: 8px;
            margin-bottom: 25px;
            font-size: 20px;
        }

        /* 確認・入力項目のレイアウト */
        .confirm-item {
            display: flex;
            flex-direction: column; /* スマホやPCで入力しきれるよう縦並びベースに変更 */
            gap: 8px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        .confirm-label {
            font-weight: bold;
            color: #555555;
        }

        /* 入力フォームのスタイル */
        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        
        /* ボタンエリア：左右並び */
        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 35px;
        }
        
        /* ボタンの共通スタイル */
        button { 
            padding: 10px 20px; 
            color: #ffffff; 
            border: none; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
            width: 100%; 
            height: 40px;     
            font-size: 16px;
        }
        button:hover { opacity: 0.9; }

        /* 確定ボタン */
        .btn-confirm { background-color: #16a34a; }
        
        /* 戻るボタン */
        .btn-back { background-color: #6b7280; }

        /* スマートフォン向けのレスポンシブスタイル */
        @media (max-width: 768px) {
            body {
                margin: 15px;
            }

            .confirm-container {
                margin: 20px auto;
                padding: 20px;
            }

            h1 {
                font-size: 24px; /* スマホの時だけ、画面からはみ出さないように縮小する */
            }

            .btn-group {
                flex-direction: column; /* スマホではボタンを縦並びにして押しやすくする */
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="header-container">
        <h1>📚 蔵書貸出管理システム</h1>
    </div>

    <div class="confirm-container">
        <h2>新規登録</h2>

        <div class="confirm-item">
            <div class="confirm-label">管理番号</div>
            <input type="text" id="serial-number" placeholder="0000000">
        </div>
        <div class="confirm-item">
            <div class="confirm-label">書名</div>
            <input type="text" id="book-name" placeholder="○○入門">
        </div>
        <div class="confirm-item">
            <div class="confirm-label">ジャンル</div>
            <input type="text" id="genre" placeholder="資格">
        </div>

        <div class="btn-group">
            <button class="btn-back" onclick="goBack()">戻る</button>
            <button class="btn-confirm" onclick="registerUser()">確定する</button>
        </div>
    </div>

    <script>
        // 「戻る」ボタン：前の一覧画面へ戻る
        function goBack() {
            window.location.href = 'index.html';
        }

        // 「確定」ボタン：ユーザー登録を確定する
        async function registerUser() {
            window.location.href = 'signup_confirm.html';
        }
    </script>
</body>
</html>
