<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵書貸出管理アプリ</title>
    <style>
        /* 全体の基本スタイル */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            /* 背景色を他の画面と同じ爽やかな青色（#3da8e3）に指定 */
            background-color: #3da8e3;
        }

        /* ヘッダーのレイアウト */
        .header-container {
            display: flex;
            justify-content: space-between; 
            align-items: center;            
            /* 背景色に合わせて白線の境界線にする */
            border-bottom: 3px solid #ffffff;   
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        h1 { 
            /* 背景が青なので、ヘッダーの文字色は白にする */
            color: #ffffff; 
            margin: 0; 
            font-size: 32px; /* index.htmlの標準サイズに統一 */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2); /* 視認性を上げるため薄い影をつける */
        }

        /* 完了画面専用の中央配置コンテナ */
        .confirm-container {
            max-width: 600px;
            margin: 40px auto;
            /* ボックスの背景色は白を指定する */
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            /* 背景が青なので影を少し強めにする */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #333333;
            /* 見出しの下線に全体のテーマカラーの青を使用する */
            border-bottom: 2px solid #3da8e3;
            padding-bottom: 8px;
            margin-bottom: 25px;
            font-size: 20px;
        }

        /* 確認項目のレイアウト */
        .confirm-item {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        .confirm-label {
            width: 140px;
            font-weight: bold;
            color: #555555;
        }

        .confirm-value {
            flex: 1;
            color: #111111;
        }

        /* ボタンエリア：配置スタイル */
        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 35px;
        }
        
        /* ボタンの共通スタイル */
        button { 
            padding: 10px 20px; 
            color: #ffffff; 
            border: none; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
            width: 100%; 
            height: 40px;     
            font-size: 16px;
        }
        button:hover { opacity: 0.9; }

        /* ホーム画面へ戻るボタン：確定ボタンと同じポジティブな緑色に変更 */
        .btn-confirm { background-color: #16a34a; }

        /* スマートフォン向けのレスポンシブスタイル */
        @media (max-width: 768px) {
            body {
                margin: 15px;
            }

            .confirm-container {
                margin: 20px auto;
                padding: 20px;
            }

            h1 {
                font-size: 24px; /* スマホの時だけ、画面からはみ出さないように縮小する */
            }

            .confirm-item {
                flex-direction: column; /* スマホでは項目名と値を縦並びにして見やすくする */
                gap: 4px;
            }

            .confirm-label {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header-container">
        <h1>📚 蔵書貸出管理システム</h1>
    </div>

    <div class="confirm-container">
        <h2>貸出図書の追加が完了しました</h2>

        <div class="confirm-item">
            <div class="confirm-label">管理番号</div>
            <div class="confirm-value" id="serial-number">00000001</div>
        </div>
        <div class="confirm-item">
            <div class="confirm-label">書名</div>
            <div class="confirm-value" id="book-name">○○入門</div>
        </div>
        <div class="confirm-item">
            <div class="confirm-label">ジャンル</div>
            <div class="confirm-value" id="genre">資格</div>
        </div>

        <div class="btn-group">
            <button class="btn-confirm" onclick="goBack()">ホーム画面へ</button>
        </div>
    </div>

    <script>
        // 「ホーム画面へ」ボタン：メインの一覧画面へ戻る
        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
